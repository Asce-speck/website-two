<!DOCTYPE html>
<html>
<head>
    <meta charset = utf-8>
    <title>signup</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="signup">
    <div>To enjoy more of our services exclusively,sign up</div>
    <form action="/signup" method="post">
    <div class="form">    
      <div>
        <label for="firstname">First Name</label>
        <input type="text">
      </div>
      <div>
        <label for="lastname">Last Name</label>
        <input type="text">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email">
      </div>
      <div>
        <label for="phonenumber">Phone Number</label>
        <input type="number">
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password">
      </div>
      <div>
        <label for="confirmpassword">Confirm Password</label>
        <input type="password">
    </div>
  </div>
      <div class="submit-login">
       <button type="submit" class="submit-button">Submit</button>
       
      </div>
    </form>
       <div class="login-button">If you already have an account<button>log in</button></div>
     </div>
</body>
</html>
